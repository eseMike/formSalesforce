<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Sales Force Form</title>
      <link rel="stylesheet" href="styles.css" />

      <!-- fonts  -->
      <link
         href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap"
         rel="stylesheet" />
   </head>
   <body>
      <div class="main-container first">
         <div>
            <img class="mainLogo" src="./src/mainLogo.svg" alt="Logo" />
            <h3>VIVE LA NUEVA EXPERIENCIA</h3>
            <span class="porcent">15%</span>
            <p class="txtPorcet">
               De descuento adicional en tu <br />
               compra al registrarte.
            </p>
         </div>
         <div class="form-container">
            <form class="custom-form">
               <label for="name">Nombre:</label>
               <input type="text" id="name" required />

               <label for="email">Correo:</label>
               <input type="email" id="email" required />

               <label for="phone">Teléfono:</label>
               <input type="tel" id="phone" required />

               <button type="submit">Enviar</button>
            </form>
         </div>
      </div>
      <!-- LOGOS  -->
      <footer class="brand-section">
         <div class="brand-logos">
            <img class="calde" src="./src/calderoni.svg" alt="Calderoni" />
            <span class="separator"></span>
            <img class="boss" src="./src/Group.svg" alt="Boss" />
            <span class="separator"></span>
            <img class="boggi" src="./src/Group (1).svg" alt="Boggi" />
            <span class="separator"></span>
            <img class="cloth" src="./src/Group (2).svg" alt="Cloth" />
            <span class="separator"></span>
            <img class="canali" src="./src/Group (3).svg" alt="Canali" />
            <span class="separator"></span>
            <img class="bugatchi" src="./src/Group (4).svg" alt="Bugatchi" />
         </div>
         <p class="legal-text">
            Aplican restricciones. Descuento exclusivo para HIGH LIFE León. Válido
            únicamente en tienda. Vigencia al 31 de enero 2025.
         </p>
      </footer>
   </body>
</html>
